# dsh-openviking bundle patch.
#
# Inserts the OpenViking plugin row into the profile composition. Nothing in
# the base bundle is disabled or replaced: the ten `mem*` tools are new names,
# so the default tool-fs rows stay untouched.
#
# Harness patches replace the targeted row's WHOLE `config` rather than merging
# into it. To override any value here, restate the complete config under the
# same `id: openviking` in your profile's own `cordis.patch.yml` (or a
# `--patch` overlay) — every key below must be repeated there. Environment
# values can be bound with `!!js` expressions, e.g.
# `apiKey: !!js process.env.OPENVIKING_API_KEY ?? ''`.
- insert:
    - id: openviking
      icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%23121826"/><path d="M6 9 L6 24 L26 24 L26 9 L13 9 L13 7 L19 7" fill="none" stroke="%2364b5ff" stroke-width="1.6"/><circle cx="20" cy="14" r="2.2" fill="%2364b5ff"/></svg>'
      name:
          zh: 'OpenViking 记忆'
          en: 'OpenViking Memory'
      description:
          zh: '为 DeepSeek Harness 提供 OpenViking 语义检索、资源管理与自动记忆'
          en: 'OpenViking semantic retrieval, resource management, and auto-recall for DeepSeek Harness'
      config:
        # OpenViking HTTP service base URL. The plugin talks HTTP only — it
        # never shells out to the `ov` CLI and never starts a server.
        endpoint: 'http://localhost:1933'
        # X-API-Key header. Empty omits the header. Prefer an env expression in
        # your own patch; never commit real keys.
        apiKey: ''
        # X-OpenViking-Account header (tenant identity). Empty omits it.
        account: ''
        # X-OpenViking-User header (user identity). Empty omits it.
        user: ''
        # X-OpenViking-Agent header. Empty omits it.
        agentId: 'deepseek-harness'
        # Per-request timeout in milliseconds (1000-300000).
        timeoutMs: 30000
        # Session-sync state file (`~` is expanded). Plain JSON: message ids
        # only, never message bodies or keys.
        stateFile: '~/.dsh/openviking/state.json'
        repoContext:
          enabled: true
          cacheTtlMs: 60000
        autoRecall:
          enabled: true
          limit: 6
          scoreThreshold: 0.15
          maxContentChars: 500
          tokenBudget: 2000
          agentSpaces: true
          refreshSteps: 10
          startupMapEveryTurns: 5
        autoCommit:
          enabled: true
          turns: 3
          intervalMinutes: 10
